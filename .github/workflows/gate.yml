# The org ruleset's required check (COI-3297). The App secrets let pre-commit fetch
# the private agentic-os hooks, see docs/actions.md.
name: gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./actions/setup-ci
        with:
          tools: uv pre-commit trufflehog
          app_id: ${{ secrets.COILYCO_HOOKS_APP_ID }}
          private_key_base64: ${{ secrets.COILYCO_HOOKS_APP_PRIVATE_KEY_BASE64 }}
      - run: pre-commit run --all-files
